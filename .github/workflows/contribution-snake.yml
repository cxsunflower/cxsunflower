name: Contribution Snake

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: cxsunflower
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=#2ee6d6&color_dots=#1b1740,#3a2a8c,#6b3fd4,#9b5cf6,#ff5ccf

      - name: Add dark space background
        run: |
          sed -E -i 's|<svg[^>]*>|&<rect width="100%" height="100%" fill="#0b0a1f"/>|' dist/snake.svg
          grep -q '#0b0a1f' dist/snake.svg

      - name: Publish SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: "chore: refresh contribution snake"