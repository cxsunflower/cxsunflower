<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Pixel spaceship on an infinite flight path</title>
  <desc id="desc">A custom pixel-art spaceship continuously flies across a starfield and around a small planet.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#263252" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#151f3b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="230" rx="8" fill="url(#panel)"/>
  <rect width="1200" height="230" fill="url(#grid)" opacity=".3"/>
  <rect x="8" y="8" width="1184" height="214" fill="none" stroke="#8b5cf6" stroke-width="4"/>
  <g fill="#d7e5ff">
    <rect x="70" y="54" width="5" height="5"/><rect x="160" y="168" width="4" height="4"/>
    <rect x="280" y="42" width="5" height="5"/><rect x="388" y="180" width="4" height="4"/>
    <rect x="530" y="56" width="4" height="4"/><rect x="680" y="172" width="5" height="5"/>
    <rect x="820" y="48" width="4" height="4"/><rect x="1080" y="168" width="5" height="5"/>
    <rect x="1140" y="62" width="4" height="4"/>
  </g>
  <g fill="#f6c85f">
    <rect x="220" y="94" width="6" height="6"/><rect x="468" y="36" width="6" height="6"/>
    <rect x="742" y="82" width="6" height="6"/><rect x="1010" y="42" width="6" height="6"/>
  </g>
  <path d="M110 130 C260 18 440 18 585 116 S890 218 1080 100" fill="none" stroke="#263b66" stroke-width="3" stroke-dasharray="8 10"/>
  <path d="M110 130 C260 18 440 18 585 116 S890 218 1080 100" fill="none" stroke="#35d6e8" stroke-width="1" stroke-dasharray="2 18" opacity=".6"/>
  <g transform="translate(1035 90)">
    <circle cx="0" cy="0" r="34" fill="#27365f"/>
    <path d="M-34 0h68M-24 -22h48M-24 22h48" stroke="#8b5cf6" stroke-width="5"/>
    <rect x="-10" y="-10" width="20" height="20" fill="#35d6e8"/>
    <rect x="-5" y="-5" width="10" height="10" fill="#f6c85f"/>
  </g>
  <path id="flight-path" d="M110 130 C260 18 440 18 585 116 S890 218 1080 100" fill="none"/>
  <g>
    <animateMotion dur="24s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#flight-path"/>
    </animateMotion>
    <g transform="translate(-24 -14)">
      <rect x="-12" y="10" width="12" height="8" fill="#f6c85f">
        <animate attributeName="opacity" values="1;.35;1" dur=".55s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="2" width="8" height="24" fill="#8b5cf6"/>
      <rect x="8" y="-6" width="24" height="40" fill="#d7e5ff"/>
      <rect x="16" y="2" width="12" height="12" fill="#35d6e8"/>
      <rect x="32" y="2" width="8" height="8" fill="#f6c85f"/>
      <rect x="32" y="22" width="8" height="8" fill="#f6c85f"/>
      <rect x="8" y="-14" width="8" height="8" fill="#35d6e8"/>
      <rect x="8" y="34" width="8" height="8" fill="#35d6e8"/>
      <rect x="40" y="10" width="8" height="12" fill="#f6c85f"/>
      <rect x="20" y="10" width="4" height="4" fill="#0b1020"/>
    </g>
  </g>
  <g font-family="monospace">
    <text x="34" y="40" fill="#35d6e8" font-size="13" font-weight="bold" letter-spacing="3">PIXEL GALAXY // FLIGHT PATH</text>
    <text x="34" y="204" fill="#94a3b8" font-size="12" letter-spacing="2">SHIP SYSTEM: ONLINE  ·  TRAJECTORY: INFINITE LOOP</text>
    <text x="1160" y="204" fill="#f6c85f" font-size="11" text-anchor="end">CX-01</text>
  </g>
</svg>