<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 36' width='900' height='36' shape-rendering='crispEdges' role='img' aria-label='pixel star divider'>
<title>pixel star divider</title>
<style>.t0{animation:tw 2.4s ease-in-out infinite}.t1{animation:tw 3.7s ease-in-out infinite}.t2{animation:tw 5.3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}.neb{animation:neb 9s ease-in-out infinite}@keyframes neb{0%,100%{opacity:.06}50%{opacity:.15}}.cur{animation:blink 1s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}.fl{animation:fl .3s steps(1,end) infinite}@keyframes fl{50%{opacity:.2}}.mt{opacity:0;animation:mt 9s linear infinite}@keyframes mt{0%{transform:translate(0,0);opacity:0}2%{opacity:1}20%{transform:translate(-320px,320px);opacity:0}100%{transform:translate(-320px,320px);opacity:0}}.ship{animation:fly 24s linear infinite}@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(980px)}}.bob{animation:bob 3s ease-in-out infinite alternate}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(6px)}}.ox,.oy{animation-timing-function:cubic-bezier(.37,0,.63,1);animation-iteration-count:infinite;animation-direction:alternate}.ox{animation-name:ox}.oy{animation-name:oy}@keyframes ox{from{transform:translateX(calc(var(--rx) * -1))}to{transform:translateX(var(--rx))}}@keyframes oy{from{transform:translateY(calc(var(--ry) * -1))}to{transform:translateY(var(--ry))}}.halo{animation:halo 2s steps(2,end) infinite}@keyframes halo{50%{opacity:.25}}.dv{animation:dv 4.4s ease-in-out infinite}@keyframes dv{0%,100%{opacity:.25}12%{opacity:1}30%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.ox{transform:translateX(var(--rx))}.mt{opacity:0}}</style>
